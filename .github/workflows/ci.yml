# Bei jedem Push (Beta und live), in gleichzeitigen Jobs: schnelle Prüfungen (Linter,
# Verschlüsselung, Rechenlogik, Build, Typprüfung), Rauchtest und Rundgänge im Browser, Abgleich
# JS <-> SQL auf einer frischen Wegwerf-Datenbank aus allen Migrationen, Typprüfung der Edge
# Functions. Veröffentlicht wird nur bei Push auf main (deploy.yml):
#   - Beta (logbuch-beta): sobald die schnellen Prüfungen und die Edge Functions grün sind, damit
#     ein Stand nach ~1 Minute zum Testen bereitsteht (Nutzer-Entscheidung 2026-11-11). Werden
#     Rauchtest, Rundgänge oder Abgleich danach rot, ist der Stand schon auf der Beta: sofort beheben.
#   - live (logbuch): erst wenn ALLES grün ist. Rot = nichts wird veröffentlicht.
# Dieselbe Datei läuft in beiden Repos; das Repo bestimmt den Weg.
# Actions mit fester Commit-Kennung statt Versions-Tag: ein Tag lässt sich nachträglich
# verschieben, und der Deploy-Job darf auf Pages schreiben. Neue Version: Kennung des Release-
# Commits eintragen (gh api repos/<owner>/<action>/commits/<tag> --jq .sha).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Linter, Tests, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linter
        run: npm run lint
      - name: Verschlüsselung (feste Testdaten)
        run: node dev/crypto-tests.mjs
      - name: Tests der Rechenlogik (Vitest)
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Kein Vorschau-Code im Build
        run: test -f dist/logbuch.html && ! grep -rlE 'logbuchPreview|mock-supabase|previewAdmin' dist/
      # Typprüfung der App: scheitert erst, wenn es mehr Meldungen als die Altlasten werden (docs/umbau.md).
      - name: Typprüfung (nicht mehr Meldungen als bisher)
        run: node dev/typecheck-count.mjs

  walkthroughs:
    name: Rauchtest, Rundgänge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Der veröffentlichte (verkleinerte) Stand einmal im Browser: Startseite unter /logbuch-beta/.
      # Hier statt bei den schnellen Prüfungen: dauert ~50 s (Browserstart), die Beta wartet nicht darauf.
      - name: Produktions-Build im Browser (Rauchtest)
        run: npm run build && node dev/dist-check.mjs
      - name: Vorschau-Server starten
        run: |
          node dev/server.mjs &
          for i in $(seq 1 60); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done
          exit 1
      # Bedienabläufe: Registrieren, Onboarding, Tutorial, App - scheitern, wenn ein Knopf fehlt
      # oder die Seite dabei einen Fehler wirft.
      - name: Rundgänge (Handy)
        run: node dev/rundgang.mjs alle
      - name: Rundgang App (PC, dunkel, große Schrift)
        run: node dev/rundgang.mjs app --device=pc --theme=dark --size=xlarge
      - name: Screenshots bei Fehler
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: dev/screenshots/
          retention-days: 7

  database:
    name: Migrationen, Abgleich JS <-> SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Der Abgleich rechnet die App-Seite über die Vorschau.
      - name: Vorschau-Server starten
        run: |
          node dev/server.mjs &
          for i in $(seq 1 60); do curl -sf http://localhost:5180/ > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Wegwerf-Datenbank aus allen Migrationen
        run: npx supabase db start
      - name: Abgleich JS <-> SQL
        run: node dev/sync-tests.mjs

  functions:
    name: Edge Functions (Typprüfung)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # node_modules-Ordner automatisch: sonst sucht Deno wegen package.json im Projektstamm die
      # npm:-Pakete dort statt sie selbst zu laden.
      - run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

  deploy-beta:
    name: Veröffentlichen (Beta)
    needs: [checks, functions]
    if: github.repository == 'LouisSchmidberger/logbuch-beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  deploy-live:
    name: Veröffentlichen (live)
    needs: [checks, walkthroughs, database, functions]
    if: github.repository == 'LouisSchmidberger/logbuch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
